name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # When no custom domain is set (no public/CNAME), the site is served at
      # https://<user>.github.io/<repo>/ — set a basePath so internal asset
      # paths resolve. When CNAME is present, build at root.
      - name: Detect deploy target
        id: target
        run: |
          if [ -f public/CNAME ]; then
            echo "BASE_PATH=" >> $GITHUB_OUTPUT
            echo "Building for custom domain (root path)."
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            echo "BASE_PATH=/$REPO_NAME" >> $GITHUB_OUTPUT
            echo "Building for project-page URL (basePath=/$REPO_NAME)."
          fi

      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.target.outputs.BASE_PATH }}
        run: npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Copy CNAME (if present)
        run: |
          if [ -f public/CNAME ]; then cp public/CNAME out/CNAME; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
