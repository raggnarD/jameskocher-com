  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f8fb"/>
      <stop offset="100%" stop-color="#e3eef6"/>
    </linearGradient>
    <radialGradient id="alexaHalo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#00caff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#00caff" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

