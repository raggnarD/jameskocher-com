  <!-- ======================== Connector ======================== -->
  <!-- Bidirectional arrows between the two logos -->
  <g stroke="#535556" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="720" y1="385" x2="900" y2="385"/>
    <polyline points="880,365 900,385 880,405"/>
    <line x1="900" y1="425" x2="720" y2="425"/>
    <polyline points="740,405 720,425 740,445"/>
  </g>

  <!-- ======================== ALEXA (right) ======================== -->
  <g transform="translate(1180 400)">
    <!-- soft outer halo -->
    <circle r="220" fill="url(#alexaHalo)"/>
    <!-- main cyan ring -->
    <circle r="170" fill="none" stroke="#00caff" stroke-width="22"/>
    <!-- top "listening" highlight arc -->
    <path d="M -120 -120 A 170 170 0 0 1 120 -120" fill="none" stroke="#1ce0ff" stroke-width="22" stroke-linecap="round"/>
    <!-- wordmark -->
    <text x="0" y="24" text-anchor="middle"
          font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
          font-weight="500" font-size="68" fill="#232f3e" letter-spacing="2">alexa</text>
  </g>

  <!-- Footer label -->
  <text x="800" y="730" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-weight="600" font-size="26" fill="#535556" letter-spacing="8">ALEXA ROUTINES IN THE RING APP</text>
</svg>
